# ============================================================
# GitHub Actions — CI básica
# Cada vez que hagas push (o un PR) a main:
#   1. Instala Node 20
#   2. Instala dependencias de backend y frontend
#   3. Ejecuta ESLint en ambos
#   4. Ejecuta los tests (Vitest) de ambos
# ============================================================

name: CI

# Disparadores: push y pull_request sobre cualquier rama
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (instalar, lint, test)
    runs-on: ubuntu-latest
    defaults:
      # Todas las tareas de este job se ejecutan desde backend/
      run:
        working-directory: backend
    env:
      # Variable mínima para que Prisma pueda "conectar" (los tests usan mocks)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

  frontend:
    name: Frontend (instalar, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test