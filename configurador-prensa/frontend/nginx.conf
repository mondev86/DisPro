# ============================================================
# nginx.conf — configuración del frontend servido por nginx
#
# Reglas clave:
#   1. SPA: todas las rutas que no son archivos → index.html
#      (react-router necesita que /designs sirva el HTML y no 404)
#   2. /api y /auth → proxificados al backend (contenedor "backend")
#   3. /socket.io → proxy WebSocket hacia el backend (tiempo real)
# ============================================================

# Esquema y dominios de confianza
server {
    listen 80;
    server_name _;

    # Máximo tamaño de subida por si algún día subimos GLTF pesados
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- API REST (proxy al backend) ----------
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    # ---------- WebSocket (Socket.io) ----------
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Tiempo de espera alto: las conexiones WebSocket son largas
        proxy_read_timeout 86400s;
    }

    # ---------- SPA (fallback a index.html) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de estáticos con hash (build de Vite versiona los archivos)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}